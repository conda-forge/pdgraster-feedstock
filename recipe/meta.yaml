{% set version = "1.1.0" %}

package:
  name: "pdgraster"
  version: {{ version }}

source:
  url: https://github.com/PermafrostDiscoveryGateway/viz-raster/archive/{{ version }}.tar.gz
  sha256: 9e37cc3edc9d0433fce95b272219cd105bfc56355376acc2ad648cd31370c36f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - __unix  # [unix]
    - python >={{ python_min }},<4.0
    - numpy >=1.2
    - shapely >=2,<3.0
    - geopandas >=0.12.2,<1.0
    - morecantile >=3.1,<4.0
    - rtree >=0.9,<1.0
    - coloraide >=0.10,<1
    - colormaps ==0.4.0
    - pillow >=9,<10
    - rasterio >=1.2,<2
    - pydantic 1.10.9
    - pdgstaging

test:
  imports:
    - pdgraster
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/PermafrostDiscoveryGateway/viz-raster
  license: Apache-2.0
  license_file: LICENSE
  summary: Permafrost Discovery Gateway vizualization pipeline for raster processing

extra:
  recipe-maintainers:
    - mfisher87
    - rushirajnenuji
